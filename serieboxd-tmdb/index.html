<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Serieboxd</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9dfc8;--sf:#f7f1e1;--tx:#241c2e;--mu:#6c6179;--bd:#241c2e;--ac:#d6336c;--cy:#0a8fb0;--g:#e08a00;--d:#cdbf9f;--sh:#241c2e;--fd:"VT323","Courier New",ui-monospace,monospace;--fb:"Space Mono","Courier New",ui-monospace,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0b16;--sf:#1a1527;--tx:#ece6fa;--mu:#9a90b5;--bd:#4a3f6b;--ac:#ff3d81;--cy:#35e0ff;--g:#ffb000;--d:#3a3254;--sh:#2a2144;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0b16;--sf:#1a1527;--tx:#ece6fa;--mu:#9a90b5;--bd:#4a3f6b;--ac:#ff3d81;--cy:#35e0ff;--g:#ffb000;--d:#3a3254;--sh:#2a2144;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:13.5px/1.5 var(--fb)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px)}
#app{max-width:880px;margin:0 auto;padding:16px}
header{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-bottom:16px;margin-bottom:16px}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:linear-gradient(90deg,#ff3d81 0 25%,#ffb000 25% 50%,#35e0ff 50% 75%,#7b5cff 75%)}
h1{margin:0;display:flex;align-items:center;gap:10px;font:400 36px/1 var(--fd);letter-spacing:2px;text-transform:uppercase;text-shadow:2px 0 var(--ac),-2px 0 var(--cy)}
h1 b{color:var(--ac);font-weight:400}
h1 svg{width:46px;height:30px;color:var(--tx)}
.reel{transform-box:fill-box;transform-origin:center;animation:sp 6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.reel{animation:none}}
nav{display:flex;gap:6px;flex-wrap:wrap}
.tab,.btn{font:400 18px/1 var(--fd);letter-spacing:1px;text-transform:uppercase;color:var(--tx);background:var(--sf);border:2px solid var(--bd);border-radius:4px;padding:6px 11px;cursor:pointer;box-shadow:3px 3px 0 var(--sh)}
.tab:not(.on):hover,.btn:not(.pri):hover{background:var(--g);color:#1a1020}
.tab:active,.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
.tab.on,.btn.pri{background:var(--ac);color:#fff}
.sm{padding:3px 8px;font-size:16px}
.card{background:var(--sf);border:2px solid var(--bd);border-radius:4px;padding:12px;margin:12px 0;box-shadow:4px 4px 0 var(--sh)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.bar>:last-child{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px;margin-top:16px}
.sc{position:relative;cursor:pointer}
.sc::after{content:"";position:absolute;left:0;right:0;top:0;aspect-ratio:2/3;pointer-events:none;border-radius:3px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.sc .t{font:400 21px/1.1 var(--fd);margin-top:8px;text-transform:uppercase}
.poster{aspect-ratio:2/3;border:2px solid var(--bd);border-radius:3px;display:flex;align-items:center;justify-content:center;color:#fff;font:400 40px var(--fd);letter-spacing:2px;box-shadow:3px 3px 0 var(--sh);transition:transform .15s,box-shadow .15s}
img.poster{display:block;object-fit:cover;width:100%;height:auto}
.sc:hover .poster{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ac)}
.hd{display:flex;gap:16px;margin:16px 0}.hd .poster{width:110px;flex:none;font-size:36px}.hd h2{margin:0 0 4px;font:400 34px/1 var(--fd);text-transform:uppercase}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.row .btn{margin-left:auto}
.row b{font:400 24px/1 var(--fd);text-transform:uppercase}
.dates{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.dates label{display:flex;flex-direction:column;font-size:11px;text-transform:uppercase;color:var(--mu);gap:2px}
input,textarea,select{font:inherit;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:3px;padding:6px 8px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--cy);outline-offset:1px}
textarea{width:100%;resize:vertical}
.ep{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}.ep input{flex:1;min-width:0}
summary{cursor:pointer;margin:10px 0;font:400 19px var(--fd);text-transform:uppercase;letter-spacing:1px}
.mu{color:var(--mu);font-size:12px}.warn{color:#e0451f;font-size:13px;margin:0 0 6px}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.form input{width:auto;max-width:150px}.form #nt{flex:1;min-width:160px;max-width:none}
.stars{white-space:nowrap}.star{font-style:normal;font-size:22px;cursor:pointer;color:var(--d);user-select:none}
.star.full{color:var(--g);text-shadow:0 0 8px rgba(255,176,0,.45)}
.star.half{background:linear-gradient(90deg,var(--g) 50%,var(--d) 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ro{pointer-events:none}.ro .star{font-size:14px}
h3{margin:22px 0 4px;font:400 22px var(--fd);text-transform:uppercase;letter-spacing:1px;color:var(--cy)}
h3::before{content:"\25B6  "}
.en{display:flex;gap:12px;align-items:center;cursor:pointer;padding:10px 0;border-bottom:2px dashed var(--bd)}
.en .poster{width:36px;font-size:14px;flex:none;box-shadow:none}
.en .d{font:400 26px/1 var(--fd);background:#0a0a0a;color:#ffb000;padding:3px 6px;border-radius:3px;min-width:40px;text-align:center;text-shadow:0 0 6px rgba(255,176,0,.6)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.big{font:400 42px/1 var(--fd);color:var(--ac)}
.hist{display:flex;gap:6px;height:140px;margin-top:10px}.hist div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.hist i{display:block;width:100%;background:repeating-linear-gradient(0deg,var(--g) 0 6px,transparent 6px 8px);min-height:2px}.hist span{font-size:11px;color:var(--mu)}
.badge{font:400 15px/1.2 var(--fd);text-transform:uppercase;background:var(--cy);color:#05060a;padding:1px 8px;border-radius:3px}
.pg{height:12px;background:var(--bg);border:2px solid var(--bd);border-radius:2px;overflow:hidden;margin:10px 0}.pg i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--ac) 0 6px,transparent 6px 8px)}
.rw{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0;padding-top:8px;border-top:2px dashed var(--bd)}.rw label{font-size:11px;text-transform:uppercase;color:var(--mu);display:flex;flex-direction:column}
.x{border:0;background:none;color:var(--mu);cursor:pointer;font-size:18px}
.err{background:#d9480f;color:#fff;border:2px solid var(--bd);border-radius:4px;padding:8px 12px;margin-bottom:10px}
.fl{display:flex;gap:6px;margin:10px 0}.fl input{flex:1;min-width:0}
footer{border-top:2px dashed var(--bd);padding-top:10px}
</style></head>
<body><div id="app"></div>
<script>
let S;try{S=JSON.parse(localStorage.getItem('sb1'))}catch(e){}
if(!S||!Array.isArray(S.series))S={series:[]};
let saveErr=false;
const save=()=>{try{localStorage.setItem('sb1',JSON.stringify(S));saveErr=false}catch(e){saveErr=true}};
let view='series',cur=null,filter='all',showAdd=false,conf='',open={},q='',sort='rec',editing=false,cards;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const hue=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%360;return h};
const fmt=d=>d?d.split('-').reverse().join('/'):'—';
const newSeason=n=>({id:uid(),start:'',end:'',rating:0,review:'',eps:Array.from({length:n},()=>({title:'',rating:0}))});
const sr=()=>S.series.find(s=>s.id===cur);
const eff=se=>{if(se.rating)return se.rating;const r=se.eps.filter(e=>e.rating);return r.length?r.reduce((a,e)=>a+e.rating,0)/r.length:0};
const sAvg=s=>{const v=s.seasons.map(eff).filter(x=>x>0);return v.length?v.reduce((a,b)=>a+b)/v.length:0};
const status=s=>s.seasons.every(x=>x.end)?'done':s.seasons.some(x=>x.start)?'doing':'want';
function stars(v,attr,ro){let h='<span class="stars'+(ro?' ro':'')+'" '+(attr||'')+'>';for(let i=1;i<=5;i++)h+='<i class="star '+(v>=i?'full':v>=i-.5?'half':'')+'" data-i="'+i+'">★</i>';return h+'</span>'}
function poster(s){if(s.poster)return '<img class="poster" loading="lazy" alt="" src="'+IMG+'w342'+s.poster+'">';const h=hue(s.title),i=s.title.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();return '<div class="poster" style="background:linear-gradient(160deg,hsl('+h+' 55% 40%),hsl('+((h+45)%360)+' 60% 22%))">'+esc(i)+'</div>'}

function list(){
  const fl=[['all','Todas'],['doing','Assistindo'],['done','Concluídas'],['want','Quero ver'],['fav','♥ Favoritas']];
  
  const chips=fl.map(f=>'<button class="tab '+(filter===f[0]?'on':'')+'" data-a="filter" data-v="'+f[0]+'">'+f[1]+'</button>').join('');
  const form='<div class="card form"><input id="nt" placeholder="Título da série"><button class="btn" data-a="find">🔎 Buscar no TMDB</button><input id="ny" type="number" placeholder="Ano"><label class="mu">Temporadas <input id="ns" type="number" min="1" max="30" value="1" style="width:70px"></label><label class="mu">Eps. por temporada <input id="ne" type="number" min="1" max="60" value="10" style="width:70px"></label><button class="btn pri" data-a="create">Criar</button><div id="sres" style="width:100%"></div></div>';
  cards=()=>{const L=S.series.filter(s=>(filter==='all'||(filter==='fav'?s.liked:status(s)===filter))&&s.title.toLowerCase().includes(q.toLowerCase()));if(sort==='nota')L.sort((a,b)=>sAvg(b)-sAvg(a));if(sort==='az')L.sort((a,b)=>a.title.localeCompare(b.title));return L.map(s=>{const a=sAvg(s);return '<div class="sc" data-a="open" data-id="'+s.id+'">'+poster(s)+'<div class="t">'+esc(s.title)+(s.liked?' ♥':'')+'</div><div class="mu">'+esc(s.year)+(a?' · ★ '+a.toFixed(1):'')+'</div></div>'}).join('')||'<p class="mu">Nenhuma série aqui.</p>'};
  return '<div class="bar">'+chips+'<button class="btn pri" data-a="toggleAdd">+ Série</button></div>'+(showAdd?form:'')+'<div class="fl"><input id="q" placeholder="Buscar série…" value="'+esc(q)+'"><select data-f="sort"><option value="rec">Recentes</option><option value="nota"'+(sort==='nota'?' selected':'')+'>Melhor nota</option><option value="az"'+(sort==='az'?' selected':'')+'>A–Z</option></select></div><div class="grid">'+cards()+'</div>';
}

function season(se,i){
  const e=eff(se),seen=se.eps.filter(x=>x.rating||x.date||x.review).length,bad=se.start&&se.end&&se.end<se.start;
  return '<section class="card"><div class="row"><b>Temporada '+(i+1)+'</b>'+stars(e,'data-si="'+i+'"')+(!se.rating&&e?'<span class="badge">média dos episódios</span>':'')+'<button class="btn sm" data-a="delS" data-si="'+i+'">'+(conf==='s'+i?'Confirmar':'Remover')+'</button></div>'
  +'<div class="dates"><label>Início<input type="date" value="'+se.start+'" data-f="start" data-si="'+i+'"></label><label>Fim da temporada<input type="date" value="'+se.end+'" data-f="end" data-si="'+i+'"></label></div>'
  +(bad?'<p class="warn">O fim é anterior ao início.</p>':'')
  +'<div class="pg"><i style="width:'+(seen/se.eps.length*100)+'%"></i></div>'+'<textarea data-f="review" data-si="'+i+'" rows="2" placeholder="Sua crítica da temporada…">'+esc(se.review)+'</textarea>'
  +'<details data-id="'+se.id+'" '+(open[se.id]?'open':'')+'><summary>Episódios ('+seen+'/'+se.eps.length+' vistos)</summary>'
  +se.eps.map((x,j)=>'<div class="ep"><span class="mu">E'+(j+1)+'</span><input data-f="etitle" data-si="'+i+'" data-ei="'+j+'" value="'+esc(x.title)+'" placeholder="Título (opcional)"><input type="date" style="width:140px;flex:none" data-f="edate" data-si="'+i+'" data-ei="'+j+'" value="'+(x.date||'')+'">'+stars(x.rating,'data-si="'+i+'" data-ei="'+j+'"')+'<button class="x" data-a="delE" data-si="'+i+'" data-ei="'+j+'">×</button><textarea data-f="ereview" data-si="'+i+'" data-ei="'+j+'" rows="1" style="width:100%" placeholder="Crítica do episódio…">'+esc(x.review||'')+'</textarea></div>').join('')
  +'<button class="btn sm" data-a="addE" data-si="'+i+'">+ Episódio</button> <span class="mu">ou marcar todos como vistos em</span> <input type="date" id="md'+i+'" style="width:140px"> <button class="btn sm" data-a="markAll" data-si="'+i+'">Marcar</button></details>'+(se.rew||[]).map((r,k)=>'<div class="rw"><span class="mu">Revisão '+(k+1)+'</span><label>Início<input type="date" value="'+r.start+'" data-f="rstart" data-si="'+i+'" data-ri="'+k+'"></label><label>Fim<input type="date" value="'+r.end+'" data-f="rend" data-si="'+i+'" data-ri="'+k+'"></label>'+stars(r.rating,'data-si="'+i+'" data-ri="'+k+'"')+'<button class="x" data-a="delR" data-si="'+i+'" data-ri="'+k+'">×</button></div>').join('')+'<button class="btn sm" data-a="addR" data-si="'+i+'">↻ Registrar revisão</button></section>';
}

function detail(){
  const s=sr();if(!s){cur=null;return list()}
  const a=sAvg(s);
  return '<button class="btn" data-a="back">← Séries</button><div class="hd">'+poster(s)+'<div>'+(editing?'<div class="fl"><input data-f="stitle" value="'+esc(s.title)+'"><input data-f="syear" type="number" value="'+esc(s.year)+'" style="max-width:90px;flex:none"></div>':'<h2>'+esc(s.title)+'</h2>')+'<div class="mu">'+(editing?'':esc(s.year)+' · ')+s.seasons.length+' temporada(s)'+(a?' · ★ '+a.toFixed(1):'')+'</div><div class="acts"><button class="btn '+(s.liked?'pri':'')+'" data-a="like">'+(s.liked?'♥ Favorita':'♡ Favoritar')+'</button><button class="btn" data-a="edit">'+(editing?'Concluir':'✎ Editar')+'</button><button class="btn" data-a="del">'+(conf==='x'?'Confirmar exclusão':'Excluir')+'</button></div></div></div>'
  +s.seasons.map(season).join('')+'<button class="btn pri" data-a="addS">+ Temporada</button>';
}

function diary(){
  const E=[];S.series.forEach(s=>s.seasons.forEach((se,i)=>{if(se.start||se.end)E.push({s:s,se:se,i:i,d:se.end||se.start});(se.rew||[]).forEach(r=>{if(r.start||r.end)E.push({s:s,se:r,i:i,d:r.end||r.start,rw:1})});se.eps.forEach((ep,j)=>{if(ep.date)E.push({s:s,se:ep,i:i,d:ep.date,ep:j+1})})}));
  E.sort((a,b)=>b.d.localeCompare(a.d));
  if(!E.length)return '<p class="mu">Registre as datas de início e fim nas temporadas para vê-las aqui.</p>';
  let h='',m='';
  for(const x of E){
    const mm=new Date(x.d+'T12:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    if(mm!==m){h+='<h3>'+mm+'</h3>';m=mm}
    h+='<div class="en" data-a="open" data-id="'+x.s.id+'"><span class="d">'+x.d.slice(8)+'</span>'+poster(x.s)+'<div style="flex:1;min-width:0"><b>'+esc(x.s.title)+'</b> <span class="mu">T'+(x.i+1)+(x.rw?' · revisão':'')+(x.ep?' · E'+x.ep+(x.se.title?' '+esc(x.se.title):''):'')+'</span><div>'+stars(x.rw||x.ep?x.se.rating:eff(x.se),'',1)+' <span class="mu">'+(x.ep?('visto em '+fmt(x.d)):((x.se.end?'':'em andamento · ')+fmt(x.se.start)+' → '+fmt(x.se.end)))+'</span></div>'+(x.se.review?'<div class="mu">'+esc(x.se.review.slice(0,140))+'</div>':'')+'</div></div>';
  }
  return h;
}

function stats(){
  const ss=S.series.flatMap(s=>s.seasons),v=ss.map(eff).filter(x=>x>0),b=Array(10).fill(0);
  v.forEach(x=>b[Math.max(0,Math.round(x*2)-1)]++);
  const mx=Math.max(1,...b),eps=ss.reduce((a,x)=>a+x.eps.filter(e=>e.rating).length,0);
  const k=[[S.series.length,'séries'],[ss.filter(x=>x.end).length,'temporadas concluídas'],[eps,'episódios avaliados'],[v.length?(v.reduce((a,c)=>a+c)/v.length).toFixed(1):'—','média das temporadas']];
  return '<div class="kpis">'+k.map(x=>'<div class="card"><b class="big">'+x[0]+'</b><div class="mu">'+x[1]+'</div></div>').join('')+'</div>'
  +'<div class="card"><b>Distribuição das notas</b><div class="hist">'+b.map((n,i)=>'<div><i style="height:'+(n/mx*85)+'%"></i><span>'+(i+1)/2+'</span></div>').join('')+'</div></div>'
  +'<div class="card"><b>Backup</b><p class="mu">Seus dados ficam só neste navegador. Copie o texto abaixo para guardar, ou cole um backup aqui para importar.</p><textarea id="bk" rows="4">'+esc(JSON.stringify(S))+'</textarea><p><button class="btn sm" data-a="imp">Importar</button></p></div>';
}

function render(){
  const nav=[['series','▶ Séries'],['diary','⏺ Diário'],['stats','■ Estatísticas']].map(x=>'<button class="tab '+(view===x[0]&&!cur?'on':'')+'" data-a="tab" data-v="'+x[0]+'">'+x[1]+'</button>').join('');
  $('#app').innerHTML='<header><h1><svg viewBox="0 0 44 28" aria-hidden="true"><rect x="1.5" y="1.5" width="41" height="25" rx="3" fill="none" stroke="currentColor" stroke-width="2.5"/><rect x="9" y="16" width="26" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><g class="reel"><circle cx="14" cy="9" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14 5v8M10 9h8" stroke="currentColor" stroke-width="1.5"/></g><g class="reel"><circle cx="30" cy="9" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M30 5v8M26 9h8" stroke="currentColor" stroke-width="1.5"/></g></svg>Serie<b>boxd</b></h1><nav>'+nav+'</nav></header>'+(saveErr?'<div class="err">Não foi possível salvar: o armazenamento do navegador está cheio ou bloqueado. Copie um backup na aba Estatísticas.</div>':'')+'<main>'+(cur?detail():view==='diary'?diary():view==='stats'?stats():list())+'</main><footer class="mu" style="margin:24px 0 8px">Este produto usa a API do TMDB, mas não é endossado nem certificado pelo TMDB.</footer>';
}

let res=null;
const API='api.php',IMG='https://image.tmdb.org/t/p/';
async function tm(q){
  let r;
  try{r=await fetch(API+'?'+q)}catch(e){throw new Error('Não consegui falar com o api.php. Abra o app por http://localhost:8000 (php -S), não pelo arquivo direto.')}
  const t=await r.text();let j;
  try{j=JSON.parse(t)}catch(e){throw new Error('O api.php não devolveu JSON. O servidor precisa executar PHP (php -S localhost:8000 ou XAMPP). Início da resposta: '+t.slice(0,80))}
  if(!r.ok)throw new Error(j.error||j.status_message||r.status);
  return j;
}
async function find(){
  const t=$('#nt').value.trim(),o=$('#sres');if(!t){$('#nt').focus();return}
  o.innerHTML='<p class="mu">Buscando…</p>';
  try{
    res=((await tm('a=search&q='+encodeURIComponent(t))).results||[]).slice(0,8);
    o.innerHTML=res.length?res.map((x,i)=>'<div class="en" data-a="pick" data-i="'+i+'">'+(x.poster_path?'<img class="poster" alt="" src="'+IMG+'w92'+x.poster_path+'">':'<div class="poster" style="background:var(--d)">?</div>')+'<div><b>'+esc(x.name)+'</b><div class="mu">'+esc((x.first_air_date||'').slice(0,4))+'</div></div></div>').join(''):'<p class="mu">Nada encontrado. Cadastre manualmente.</p>';
  }catch(e){o.innerHTML='<p class="warn">Erro na busca: '+esc(e.message)+'</p>'}
}
async function pick(i){
  const x=res[i],o=$('#sres');o.innerHTML='<p class="mu">Importando temporadas e episódios…</p>';
  try{
    const d=await tm('a=tv&id='+x.id),ns=(d.seasons||[]).filter(s=>s.season_number>0&&s.episode_count>0);
    const full=await Promise.all(ns.map(s=>tm('a=season&id='+x.id+'&n='+s.season_number)));
    S.series.unshift({id:uid(),tmdb:x.id,title:d.name,year:(d.first_air_date||'').slice(0,4),poster:d.poster_path||'',liked:false,seasons:full.map(f=>{const se=newSeason(0);se.eps=(f.episodes||[]).map(e=>({title:e.name||'',rating:0}));if(!se.eps.length)se.eps=newSeason(1).eps;return se})});
    showAdd=false;cur=S.series[0].id;res=null;save();render();
  }catch(e){o.innerHTML='<p class="warn">Erro ao importar: '+esc(e.message)+'</p>'}
}

const A={
  tab:d=>{view=d.v;cur=null;showAdd=false;conf=''},
  open:d=>{cur=d.id;conf='';editing=false;scrollTo(0,0)},
  back:()=>{cur=null;conf=''},
  toggleAdd:()=>{showAdd=!showAdd},
  filter:d=>{filter=d.v},
  like:()=>{const s=sr();s.liked=!s.liked},
  addS:()=>{const s=sr(),l=s.seasons[s.seasons.length-1];s.seasons.push(newSeason(l?l.eps.length:8))},
  addE:d=>{sr().seasons[d.si].eps.push({title:'',rating:0})},
  delE:d=>{const e=sr().seasons[d.si].eps;if(e.length>1)e.splice(+d.ei,1)},addR:d=>{const se=sr().seasons[d.si];(se.rew=se.rew||[]).push({start:'',end:'',rating:0})},delR:d=>{sr().seasons[d.si].rew.splice(+d.ri,1)},edit:()=>{editing=!editing},find:()=>{find();return 1},pick:d=>{pick(d.i);return 1},markAll:d=>{const v=$('#md'+d.si).value;if(!v){$('#md'+d.si).focus();return 1}sr().seasons[d.si].eps.forEach(e=>{if(!e.date)e.date=v})},
  delS:d=>{const k='s'+d.si;if(conf!==k){conf=k;return}conf='';sr().seasons.splice(+d.si,1)},
  del:()=>{if(conf!=='x'){conf='x';return}S.series=S.series.filter(s=>s.id!==cur);cur=null;conf=''},
  create:()=>{
    const t=$('#nt').value.trim();if(!t){$('#nt').focus();return 1}
    const ns=Math.min(30,Math.max(1,+$('#ns').value||1)),ne=Math.min(60,Math.max(1,+$('#ne').value||10));
    S.series.unshift({id:uid(),title:t,year:$('#ny').value,liked:false,seasons:Array.from({length:ns},()=>newSeason(ne))});
    showAdd=false;cur=S.series[0].id;
  },
  imp:()=>{try{const j=JSON.parse($('#bk').value);if(j&&Array.isArray(j.series)){S=j;cur=null}}catch(e){}}
};

document.addEventListener('click',e=>{
  const st=e.target.closest('.star');
  if(st){
    const p=st.parentNode,sv=sr();if(!sv)return;
    const se=sv.seasons[p.dataset.si],o=p.dataset.ei!==undefined?se.eps[p.dataset.ei]:p.dataset.ri!==undefined?se.rew[p.dataset.ri]:se;
    let v=+st.dataset.i-(e.clientX-st.getBoundingClientRect().left<st.offsetWidth/2?.5:0);
    o.rating=o.rating===v?0:v;save();render();return;
  }
  const b=e.target.closest('[data-a]');if(!b)return;
  if(A[b.dataset.a](b.dataset)===1)return;
  save();render();
});
document.addEventListener('change',e=>{
  const t=e.target,f=t.dataset&&t.dataset.f,s=sr();if(f==='sort'){sort=t.value;render();return}if(!f||!s||f==='stitle'||f==='syear')return;
  const se=s.seasons[t.dataset.si];
  if(f==='start'||f==='end')se[f]=t.value;
  else if(f==='review')se.review=t.value;
  else if(f==='etitle')se.eps[t.dataset.ei].title=t.value;
  else if(f==='edate')se.eps[t.dataset.ei].date=t.value;
  else if(f==='ereview')se.eps[t.dataset.ei].review=t.value;
  else if(f==='rstart')se.rew[t.dataset.ri].start=t.value;
  else if(f==='rend')se.rew[t.dataset.ri].end=t.value;
  save();render();
});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset&&t.dataset.f;if(t.id==='q'){q=t.value;$('.grid').innerHTML=cards();return}const s=sr();if(s&&f==='stitle'){s.title=t.value||s.title;save()}if(s&&f==='syear'){s.year=t.value;save()}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.id)open[d.dataset.id]=d.open},true);
render();
</script></body></html>
